server {
    listen 443 ssl http2;
    server_name 24policybot.ru www.24policybot.ru;

    ssl_certificate     /etc/letsencrypt/live/24policybot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/24policybot.ru/privkey.pem;

    root /var/www/24policybot.ru/static;

    location /images/ {
        alias /var/www/24policybot.ru/static/images/;
        expires 30d;
    }
    location = /offer {
        try_files /offer.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    location = /privacy {
        try_files /privacy.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /consent {
        try_files /consent.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /legal {
        try_files /legal.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /tariffs {
        try_files /tariffs.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Проксирование Telegram webhook
    location /webhook/telegram {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Проксирование Robokassa webhook (ResultURL)
    location /webhook/robokassa {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
    }

    # Все остальные запросы возвращают 404
    location / {
        return 404;
    }
}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Silent Couple</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .status {
            padding: 24px;
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="status" id="status">Обновляем время…</div>
    <script>
        (function () {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            const statusEl = document.getElementById('status');
            const params = new URLSearchParams(window.location.search);
            const action = params.get('action') || 'sync';

            function endpointFor(actionName) {
                if (actionName === 'start_continue') return '/api/start/continue';
                return '/api/timezone/sync';
            }

            async function run() {
                const timezoneName = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const utcOffset = -new Date().getTimezoneOffset() / 60;
                const initData = tg.initData;

                if (!initData) {
                    statusEl.textContent = 'Откройте через Telegram.';
                    return;
                }

                const payload = {
                    initData,
                    timezone_name: timezoneName,
                    utc_offset: utcOffset,
                };

                for (const [key, value] of params.entries()) {
                    if (key !== 'action') {
                        payload[key] = value;
                    }
                }

                const response = await fetch(endpointFor(action), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    statusEl.textContent = 'Не удалось выполнить действие. Закройте окно и попробуйте снова.';
                    return;
                }

                tg.close();
            }

            run().catch(function () {
                statusEl.textContent = 'Ошибка соединения. Проверьте интернет и попробуйте снова.';
            });
        })();
    </script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # Settings requires these at import time; tests are fully mocked.
          TG_BOT_TOKEN: test-bot-token
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          DEMO_PAIR_HASH_SALT: test-demo-salt
          ROBOKASSA_MERCHANT_LOGIN: test-merchant
          ROBOKASSA_PASSWORD_1: test-password-1
          ROBOKASSA_PASSWORD_2: test-password-2
        run: python -m pytest tests -q

      - name: Check formatting (black, isort)
        run: |
          black --check src tests
          isort --check-only src tests
